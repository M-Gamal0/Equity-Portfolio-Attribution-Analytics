name: Public package checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-checks:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package and checking tools
        run: python -m pip install ".[demo,app]" pytest ruff build
      - name: Check Python code
        run: python -m ruff check src app scripts tests examples
      - name: Run deterministic public-only tests
        run: python -m pytest -q -m "not research and not public_demo"
      - name: Run own-DataFrame example
        run: python examples/custom_inputs/run_example.py
      - name: Build source and wheel distributions
        run: python -m build
